schema: spec-driven

context: |
  Product: skilllog — neobrutalism web app for an LLM/Agentic-AI learning roadmap + progress tracker.
  Stack: Next.js App Router (TypeScript) + Auth.js v5 (Google OAuth + credentials w/ bcrypt) + Supabase Postgres.
  Deploy target: Vercel free tier.
  Roadmap content source: LLM_Agentic_AI_Roadmap_Tracker.md (10 pillars, ~45 items, [KEY] badges, gap-fill callouts).
  Public: roadmap readable without auth; progress/notes require login.
  Design: neobrutalism (bold borders, vivid accents, raw high-contrast).

